apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deploydock-namespace-admin
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deploydock-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: deploydock:admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deploydock-namespace-admin
