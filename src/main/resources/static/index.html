<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="DeployDock Kubernetes 네임스페이스 관리 콘솔">
    <title>DeployDock</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/" aria-label="DeployDock 홈">
        <span class="brand-mark">D</span>
        <span>DeployDock</span>
    </a>
    <div class="session-actions">
        <span id="session-user" class="session-user" hidden></span>
        <button id="logout-button" class="button button-ghost" type="button" hidden>로그아웃</button>
    </div>
</header>

<main class="shell">
    <section class="hero">
        <p class="eyebrow">KUBERNETES ACCESS CONSOLE</p>
        <h1>허용된 네임스페이스를<br>한곳에서 관리하세요.</h1>
        <p class="hero-copy">DeployDock 계정으로 로그인하면 Kubernetes RBAC에 따라 접근 가능한 환경만 안전하게 표시됩니다.</p>
    </section>

    <section id="auth-panel" class="panel auth-panel" aria-labelledby="auth-title">
        <div class="panel-heading">
            <div>
                <p class="section-label">ACCOUNT</p>
                <h2 id="auth-title">시작하기</h2>
            </div>
            <div class="tabs" role="tablist" aria-label="계정 작업">
                <button class="tab active" type="button" role="tab" data-tab="login" aria-selected="true">로그인</button>
                <button class="tab" type="button" role="tab" data-tab="signup" aria-selected="false">회원가입</button>
            </div>
        </div>

        <form id="login-form" class="form-stack">
            <label>
                사용자 이름
                <input name="username" autocomplete="username" placeholder="admin" required>
            </label>
            <label>
                비밀번호
                <input name="password" type="password" autocomplete="current-password" placeholder="8자 이상" required>
            </label>
            <button class="button button-primary" type="submit">로그인</button>
        </form>

        <form id="signup-form" class="form-stack" hidden>
            <label>
                사용자 이름
                <input name="username" autocomplete="username" pattern="[a-z0-9](?:[-a-z0-9]*[a-z0-9])?" maxlength="63" placeholder="alice" required>
            </label>
            <label>
                비밀번호
                <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="8자 이상" required>
            </label>
            <button class="button button-primary" type="submit">계정 만들기</button>
        </form>
    </section>

    <section id="workspace" class="workspace" hidden>
        <div class="workspace-heading">
            <div>
                <p class="section-label">NAMESPACES</p>
                <h2>접근 가능한 환경</h2>
            </div>
            <button id="refresh-button" class="button button-secondary" type="button">새로고침</button>
        </div>

        <div class="workspace-grid">
            <div class="panel namespace-panel">
                <div id="namespace-list" class="namespace-list" aria-live="polite"></div>
            </div>

            <aside class="panel create-panel">
                <p class="section-label">ADMIN</p>
                <h2>네임스페이스 생성</h2>
                <p>생성 권한은 Kubernetes RBAC로 확인합니다.</p>
                <form id="namespace-form" class="form-stack">
                    <label>
                        네임스페이스 이름
                        <input name="name" pattern="[a-z0-9](?:[-a-z0-9]*[a-z0-9])?" maxlength="63" placeholder="team-alpha" required>
                    </label>
                    <button class="button button-primary" type="submit">생성하기</button>
                </form>
            </aside>
        </div>
    </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/js/app.js" defer></script>
</body>
</html>
