<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="DeployDock 사용자 정의 리소스 생성">
    <title>CR 생성 · DeployDock</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/" aria-label="DeployDock 홈">
        <span class="brand-mark">D</span>
        <span>DeployDock</span>
    </a>
    <div class="session-actions">
        <a class="button button-ghost" href="/">홈</a>
        <span id="session-user" class="session-user" hidden></span>
        <button id="logout-button" class="button button-ghost" type="button">로그아웃</button>
    </div>
</header>

<main class="shell page-shell">
    <section class="page-heading">
        <p class="eyebrow">CUSTOM RESOURCES</p>
        <h1>CR 생성</h1>
        <p>내가 <code>create</code> 권한을 가진 네임스페이스와 등록된 CRD만 선택할 수 있습니다.</p>
    </section>

    <section id="access-message" class="panel access-message" aria-live="polite">생성 가능한 리소스를 확인하는 중입니다.</section>

    <section id="create-content" class="page-grid" hidden>
        <section class="panel page-panel" aria-labelledby="create-title">
            <div class="panel-heading">
                <div>
                    <p class="section-label">CREATE</p>
                    <h2 id="create-title">새 사용자 정의 리소스</h2>
                </div>
                <button id="refresh-button" class="button button-secondary" type="button">권한 새로고침</button>
            </div>
            <form id="custom-resource-form" class="form-stack">
                <label>
                    네임스페이스 / 리소스
                    <select id="resource-selection" name="resourceSelection" required></select>
                </label>
                <label>
                    리소스 이름
                    <input name="name" pattern="[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?" maxlength="253" placeholder="example-widget" required>
                </label>
                <label>
                    spec (JSON 객체)
                    <textarea name="spec" rows="12" spellcheck="false" required>{}</textarea>
                </label>
                <button class="button button-primary" type="submit">CR 생성</button>
            </form>
        </section>

        <aside class="panel page-panel result-panel" aria-labelledby="result-title">
            <p class="section-label">RESULT</p>
            <h2 id="result-title">생성 결과</h2>
            <pre id="creation-result">아직 생성된 리소스가 없습니다.</pre>
        </aside>
    </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/js/custom-resources.js" defer></script>
</body>
</html>
